[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "radar-riesgo-farmaceutico"
version = "1.0.0"
description = "Sistema de priorización de señales de riesgo farmacológico para DIGEMID (MINSA Perú)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["farmacovigilancia", "FAERS", "DIGEMID", "PRR", "ROR", "minería de datos"]
authors = [
    { name = "Jose Martinez", email = "" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.10.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
science = [
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "spacy>=3.7.0",
]

[project.scripts]
seed-data   = "src.pipeline.seed_data:seed_sample_data"
ingest-faers = "src.pipeline.ingest_faers:main"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["src/pipeline/seed_data.py", "**/__pycache__/**"]

[tool.coverage.report]
show_missing = true
skip_covered = false
